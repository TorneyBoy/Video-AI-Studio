[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-ai-studio"
version = "0.1.0"
description = "Production-oriented Video AI Studio control plane and media workflow foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "aiosqlite>=0.20,<1.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]
temporal = ["temporalio>=1.7,<2.0"]
gateway = ["alibabacloud-oss-v2==1.4.0", "alibabacloud-credentials==1.0.12"]
ice = ["alibabacloud-ice20201109==6.20.2"]
fc = ["alibabacloud-fc20230330==4.8.3"]
operations = ["cryptography==50.0.2"]

[project.scripts]
video-ai = "app.cli:main"
video-ai-recovery = "app.services.database_recovery:main"
video-ai-legacy-owner = "app.services.legacy_owner_cli:main"
timeline-engine = "timeline_engine.cli:main"

[tool.setuptools]
packages = ["app", "app.api", "app.services", "timeline_engine", "media_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702", "I001"]

