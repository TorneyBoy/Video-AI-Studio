# Internal network only. The scrape key cannot execute jobs or read diagnostics.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/video-ai-alerts.yml
scrape_configs:
  - job_name: video-ai-control
    metrics_path: /metrics
    scheme: http
    http_headers:
      X-Metrics-Key:
        files:
          - /run/secrets/video-ai-metrics-key
    static_configs:
      - targets: ["api:8000"]
# No Alertmanager or external receiver is configured by this template.
